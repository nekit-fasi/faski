<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Смартфон — Three.js + GLTFExporter</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #eee;
        }
        canvas { display: block; }

        #downloadBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            padding: 10px 18px;
            background: #1f6feb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(31, 111, 235, 0.4);
            transition: transform 0.15s ease, background 0.2s ease;
        }
        #downloadBtn:hover  { background: #388bfd; transform: translateY(-1px); }
        #downloadBtn:active { transform: translateY(0); }

        #hint {
            position: fixed;
            left: 16px;
            bottom: 16px;
            font-size: 12px;
            color: #888;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <button id="downloadBtn">Скачать .glb</button>
    <div id="hint">ЛКМ — вращение · Колесо — зум · ПКМ — перемещение</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter }  from 'three/addons/exporters/GLTFExporter.js';

        // ---------- Сцена, камера, рендерер ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            100
        );
        camera.position.set(1.2, 0.8, 2.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ---------- Свет ----------
        const ambient = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 4, 5);
        scene.add(dirLight);

        // ---------- OrbitControls ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.8;
        controls.maxDistance = 8;

        // ---------- Модель смартфона (одна Group) ----------
        const phone = new THREE.Group();
        phone.name = 'Phone';

        // 1. Корпус — тёмный металлик
        const bodyGeo = new THREE.BoxGeometry(0.75, 1.5, 0.08);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x1c1c1c,
            metalness: 1.0,
            roughness: 0.3
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.name = 'Body';
        phone.add(body);

        // 2. Экран — тёмно-синий с emissive, на передней грани (z = 0.041)
        const screenGeo = new THREE.PlaneGeometry(0.68, 1.4);
        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x0a1a3a,
            emissive: 0x1a3a6a,
            emissiveIntensity: 0.9,
            metalness: 0.2,
            roughness: 0.4
        });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.name = 'Screen';
        screen.position.z = 0.041;
        phone.add(screen);

        // 3. Камера — цилиндр в верхнем левом углу задней стенки, повёрнут на 90° по X
        const camGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.03, 32);
        const camMat = new THREE.MeshStandardMaterial({
            color: 0x000000,
            metalness: 1.0,
            roughness: 0.2
        });
        const cam = new THREE.Mesh(camGeo, camMat);
        cam.name = 'Camera';
        // Верхний левый угол задней стенки: x<0, y>0, z=-0.04
        cam.position.set(-0.25, 0.55, -0.04);
        cam.rotation.x = Math.PI / 2; // ось цилиндра теперь вдоль Z
        phone.add(cam);

        // 4. Кнопка питания — сбоку справа
        const btnGeo = new THREE.BoxGeometry(0.01, 0.15, 0.03);
        const btnMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a2a,
            metalness: 1.0,
            roughness: 0.35
        });
        const btn = new THREE.Mesh(btnGeo, btnMat);
        btn.name = 'PowerButton';
        // Правая грань корпуса на x = 0.375, кнопка чуть выступает
        btn.position.set(0.38, 0.2, 0);
        phone.add(btn);

        scene.add(phone);

        // ---------- Экспорт в .glb ----------
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.addEventListener('click', () => {
            const exporter = new GLTFExporter();
            exporter.parse(
                phone,
                (result) => {
                    // result — ArrayBuffer, т.к. binary: true
                    const blob = new Blob([result], { type: 'model/gltf-binary' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'phone.glb';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                },
                (error) => {
                    console.error('Ошибка экспорта:', error);
                    alert('Не удалось экспортировать модель: ' + error.message);
                },
                { binary: true }
            );
        });

        // ---------- Resize ----------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------- Цикл рендера ----------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
